<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch</title>
    <link data-trunk rel="rust" data-wasm-opt="s" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* Let Rust handle panning/zooming/drawing itself. */
        touch-action: none;
      }
      #download-tikz {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1;
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        cursor: pointer;
      }
      #download-tikz:hover {
        background: #3a3a3a;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <button id="download-tikz" type="button">Download TikZ</button>
  </body>
</html>

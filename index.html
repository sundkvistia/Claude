<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch</title>
    <link data-trunk rel="rust" data-wasm-opt="s" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* Let Rust handle panning/zooming/drawing itself. */
        touch-action: none;
      }
      #download-tikz {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1;
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        cursor: pointer;
      }
      #download-tikz:hover {
        background: #3a3a3a;
      }
      #symmetric-label,
      .color-label {
        position: fixed;
        right: 12px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        cursor: pointer;
        user-select: none;
      }
      #symmetric-label {
        top: 52px;
      }
      #ink-color-label {
        top: 92px;
      }
      #background-color-label {
        top: 132px;
      }
      .color-label input[type="color"] {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid #4a4a4a;
        border-radius: 3px;
        background: none;
        cursor: pointer;
      }
      #layer-label {
        position: fixed;
        top: 172px;
        right: 12px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        user-select: none;
      }
      #layer-select {
        background: #1e1e1e;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 3px;
        font: 14px sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <button id="download-tikz" type="button">Download TikZ</button>
    <label id="symmetric-label">
      <input type="checkbox" id="symmetric-toggle" checked />
      Symmetric curve
    </label>
    <label id="ink-color-label" class="color-label">
      <input type="color" id="ink-color" value="#f0f0f0" />
      Line color
    </label>
    <label id="background-color-label" class="color-label">
      <input type="color" id="background-color" value="#1e1e1e" />
      Background color
    </label>
    <label id="layer-label">
      Layer
      <select id="layer-select">
        <option value="0">1</option>
        <option value="1">2</option>
        <option value="2">3</option>
        <option value="3">4</option>
        <option value="4">5</option>
      </select>
    </label>
  </body>
</html>

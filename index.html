<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sketch</title>
    <link data-trunk rel="rust" data-wasm-opt="s" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1e1e1e;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        /* Let Rust handle panning/zooming/drawing itself. */
        touch-action: none;
      }
      #show-tikz {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1;
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        cursor: pointer;
      }
      #show-tikz:hover {
        background: #3a3a3a;
      }
      #tikz-panel {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
      }
      #tikz-panel[hidden] {
        display: none;
      }
      #tikz-panel-inner {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: min(600px, 90vw);
        padding: 16px;
        background: #2d2d2d;
        border: 1px solid #4a4a4a;
        border-radius: 6px;
      }
      #tikz-output {
        width: 100%;
        height: 280px;
        padding: 8px;
        background: #1e1e1e;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 13px monospace;
        resize: vertical;
        box-sizing: border-box;
      }
      #tikz-panel-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      #tikz-panel-buttons button {
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        cursor: pointer;
      }
      #tikz-panel-buttons button:hover {
        background: #3a3a3a;
      }
      #symmetric-label,
      .color-label {
        position: fixed;
        right: 12px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        cursor: pointer;
        user-select: none;
      }
      #symmetric-label {
        top: 52px;
      }
      #ink-color-label {
        top: 92px;
      }
      #background-color-label {
        top: 132px;
      }
      .color-label input[type="color"] {
        width: 24px;
        height: 24px;
        padding: 0;
        border: 1px solid #4a4a4a;
        border-radius: 3px;
        background: none;
        cursor: pointer;
      }
      #layer-label {
        position: fixed;
        top: 172px;
        right: 12px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        user-select: none;
      }
      #layer-select {
        background: #1e1e1e;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 3px;
        font: 14px sans-serif;
        cursor: pointer;
      }
      #snap-radius-label {
        position: fixed;
        top: 212px;
        right: 12px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        user-select: none;
      }
      #snap-radius {
        width: 48px;
        background: #1e1e1e;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 3px;
        font: 14px sans-serif;
      }
      #grid-label {
        position: fixed;
        top: 252px;
        right: 12px;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px;
        background: #2d2d2d;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
        font: 14px sans-serif;
        cursor: pointer;
        user-select: none;
      }
      #grid-size {
        width: 48px;
        background: #1e1e1e;
        color: #f0f0f0;
        border: 1px solid #4a4a4a;
        border-radius: 3px;
        font: 14px sans-serif;
        cursor: text;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <button id="show-tikz" type="button">Show TikZ</button>
    <div id="tikz-panel" hidden>
      <div id="tikz-panel-inner">
        <textarea id="tikz-output" readonly spellcheck="false"></textarea>
        <div id="tikz-panel-buttons">
          <button id="copy-tikz" type="button">Copy to clipboard</button>
          <button id="close-tikz" type="button">Close</button>
        </div>
      </div>
    </div>
    <label id="symmetric-label">
      <input type="checkbox" id="symmetric-toggle" checked />
      Symmetric curve
    </label>
    <label id="ink-color-label" class="color-label">
      <input type="color" id="ink-color" value="#f0f0f0" />
      Line color
    </label>
    <label id="background-color-label" class="color-label">
      <input type="color" id="background-color" value="#1e1e1e" />
      Background color
    </label>
    <label id="layer-label">
      Layer
      <select id="layer-select">
        <option value="0">1</option>
        <option value="1">2</option>
        <option value="2">3</option>
        <option value="3">4</option>
        <option value="4">5</option>
      </select>
    </label>
    <label id="snap-radius-label">
      Snap radius
      <input type="number" id="snap-radius" value="12" min="0" max="100" step="1" />
    </label>
    <label id="grid-label">
      <input type="checkbox" id="grid-toggle" />
      Snap to grid
      <input type="number" id="grid-size" value="50" min="1" max="500" step="1" />
    </label>
  </body>
</html>
